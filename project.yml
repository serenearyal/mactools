name: MacTools

options:
  bundleIdPrefix: com.serenearyal
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
  groupSortPosition: top
  minimumXcodeGenVersion: "2.42.0"

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

packages:
  MacToolsCore:
    path: Packages/MacToolsCore

targetTemplates:
  CommandLineTool:
    type: tool
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "4"
        SKIP_INSTALL: YES

targets:
  MacTools:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "MacTools.entitlements"
          - "Resources/LaunchDaemons/**"
      # SMAppService.daemon requires the plist at this exact path, not in Resources.
      - path: App/Resources/LaunchDaemons/com.serenearyal.mactools.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    info:
      path: App/Info.plist
      properties:
        CFBundleIconFile: MacTools
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        CFBundleDisplayName: MacTools
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_NAME: MacTools
        PRODUCT_BUNDLE_IDENTIFIER: com.serenearyal.mactools
        CODE_SIGN_ENTITLEMENTS: App/MacTools.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "4"
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: MacToolsCore
        products:
          - SMCKit
          - FanControl
          - SysMetrics
          - ScanKit
          - HelperProtocol
          - ReportKit
          - AwakeKit
          - BacklightKit
          - WindowKit
      - target: MacToolsHelper
        embed: true
        link: false
        codeSign: true
        copy:
          destination: executables
    # Order matters: the helper must land in Contents/MacOS before the app is signed.
    preBuildScripts:
      - script: '"$SRCROOT/scripts/check_signing.sh"'
        name: Reject ad-hoc signing
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/scripts/check_signing.sh

  MacToolsHelper:
    templates:
      - CommandLineTool
    sources:
      - Helper
    settings:
      base:
        PRODUCT_NAME: MacToolsHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.serenearyal.mactools.helper
        INFOPLIST_KEY_CFBundleIdentifier: com.serenearyal.mactools.helper
    dependencies:
      - package: MacToolsCore
        products:
          - SMCKit
          - FanControl
          - SysMetrics
          - HelperProtocol

  # The window the mover is tested against. A bundled app, because an
  # unbundled binary vends no accessibility server at all, and one of ours,
  # because no test may move a window of the user's. It is never embedded in
  # MacTools.app: it sits next to it in the build directory and `make
  # window-selftest` passes its path.
  MacToolsAXProbe:
    type: application
    platform: macOS
    sources:
      - Probe
    settings:
      base:
        PRODUCT_NAME: MacToolsAXProbe
        PRODUCT_BUNDLE_IDENTIFIER: com.serenearyal.mactools.axprobe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: MacTools AX Probe
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "4"
        SKIP_INSTALL: YES

  mactoolsctl:
    templates:
      - CommandLineTool
    sources:
      - mactoolsctl
      # The XPC client is the app's, so the CLI proves the same code path.
      - App/Helper/HelperConnection.swift
      - App/Model/AppLog.swift
      # The same mapping, the same sysctl reader and the same two system
      # clients the app uses, so `mactoolsctl report`, `mactoolsctl awake` and
      # `mactoolsctl backlight` prove the app's own paths rather than a copy.
      - App/Model/ReportBuilder.swift
      - App/Model/SystemContextParser.swift
      - App/Model/SystemContextReader.swift
      - App/Power/PowerSource.swift
      - App/Power/PowerAssertion.swift
      - App/Backlight/BacklightClient.swift
      - App/Backlight/BacklightEngine.swift
      - App/Backlight/KeyboardBacklightClient.swift
      # The accessibility reads of `mactoolsctl window list` are the app's, so the
      # CLI cannot drift from what the window manager sees.
      - App/Windows/AXBridge.swift
    settings:
      base:
        PRODUCT_NAME: mactoolsctl
        PRODUCT_BUNDLE_IDENTIFIER: com.serenearyal.mactools.mactoolsctl
    dependencies:
      - package: MacToolsCore
        products:
          - SMCKit
          - FanControl
          - SysMetrics
          - ScanKit
          - HelperProtocol
          - ReportKit
          - AwakeKit
          - BacklightKit

  MacToolsIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MacToolsIntegrationTests
      # The helper service, without its main.swift, so the XPC round trip can
      # be tested over an anonymous listener with no daemon installed. The fan
      # coordinator comes with it, driven by a fake instead of the SMC.
      - Helper/HelperService.swift
      - Helper/ClientAuth.swift
      - Helper/FanCoordinator.swift
      - Helper/PowerWatcher.swift
      # The installer builds a shell script and an AppleScript by hand; the
      # tests lint and compile what it builds.
      - App/Helper/HelperInstalling.swift
      - App/Helper/LegacyHelperInstaller.swift
      # The rules that decide when the keyboard comes back, and the three
      # permissions they read. Pure Swift with no AppKit, so the tests share
      # the app's copy instead of a rewrite.
      - App/KeyboardLock/KeyboardLockPolicy.swift
      # The login-item status mapping, so the launch-at-login toggle can be
      # checked without registering anything with launchd.
      - App/Model/LaunchAtLogin.swift
      - App/Model/AppLog.swift
      # The one-time copy of the settings out of the defaults domain of the
      # old name. Pure rules over a two-method store protocol, so the tests
      # drive it with two dictionaries and touch no real preferences.
      - App/Model/SettingsMigration.swift
      # What the window, the popover and the menu bar ask the stores to
      # sample. Pure rules over the request types next to them. `AppSettings`
      # itself stays out: an `@Observable` class in this bundle makes the
      # linker pull SwiftUICore, which a unit-test bundle may not link.
      - App/Model/SamplingPlan.swift
      # When a temperature in the label turns amber, orange and red, and how
      # fast the fan glyph turns. Pure arithmetic in files of their own, next
      # to the AppKit drawing that uses them, for the same linker reason.
      - App/MenuBar/HeatTint.swift
      - App/MenuBar/FanSpin.swift
      # The rows the Processes tab draws, derived once per sample instead of
      # inside `body`, and the bounded cache behind the menu bar label. Both
      # are plain values, for the same linker reason as everything here.
      - App/Model/ProcessRows.swift
      - App/Model/LRUCache.swift
      - App/Model/MainTab.swift
      - App/Model/PopoverSection.swift
      # The popover's sizes. Plain numbers in a file of their own, away from
      # the views, because the panel and every section in it are fixed frames
      # now and the arithmetic between them has to hold.
      - App/MenuBar/PopoverLayout.swift
      - App/Model/MetricsSample.swift
      - App/Model/MenuBarMetric.swift
      # The graph and sensor history: which traces a pass adds and which one
      # it removes. A struct over values, in its own file away from the
      # `@Observable` store, for the same linker reason as `AppSettings`.
      - App/Model/MetricsHistory.swift
      # R2, R3 and R4. All four are plain files for the same linker reason as
      # `AppSettings`: the mapping, the sysctl parsing, the Keep Awake state
      # machine and the backlight rules carry no `@Observable` and no SwiftUI,
      # so the tests share the app's copy instead of a rewrite. The
      # `@Observable` shells around them stay out of this bundle.
      - App/Model/ReportBuilder.swift
      - App/Model/SystemContextParser.swift
      - App/Model/SystemContextReader.swift
      - App/Power/KeepAwakeMachine.swift
      - App/Power/PowerSource.swift
      - App/Backlight/BacklightClient.swift
      - App/Backlight/BacklightEngine.swift
      # What the window manager remembers: the shortcut choice, the per-action
      # switches and the gap. A plain Codable value, away from the AX calls.
      - App/Windows/WindowSettingsData.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serenearyal.mactools.integration-tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: MacToolsCore
        products:
          - SMCKit
          - FanControl
          - SysMetrics
          - ScanKit
          - HelperProtocol
          - ReportKit
          - AwakeKit
          - BacklightKit
          - WindowKit

schemes:
  MacTools:
    build:
      targets:
        MacTools: all
        mactoolsctl: all
        MacToolsAXProbe: all
        MacToolsIntegrationTests: [test]
    run:
      config: Debug
      executable: MacTools
    test:
      config: Debug
      targets:
        - MacToolsIntegrationTests
    archive:
      config: Release

  mactoolsctl:
    build:
      targets:
        mactoolsctl: all
    run:
      config: Debug
      executable: mactoolsctl
